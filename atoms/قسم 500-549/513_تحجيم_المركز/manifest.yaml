id: 513
name: "Position Sizing"
version: "4.8.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "risk.position_size.state"
  - "risk.position_size.rejected"
  # ٢٠٢٦-٠٩-١٨ — تنشره الذرّة فعلًا عند نقص حقيقةٍ ماليّة ولم يكن معلَنًا.
  - "financial.truth.shortage"

subscribes:
  - "market.tick.validated"
  - "platform.account.state"
  - "market.symbol_specs"
  - "market.ctrader.symbol_specs"
  - "risk.structure_stop.state"
  - "dial.profile.state"
  # 2026-10-23 (sealed red lines, law 7): the trade risk from the owner's settings in 509.
  - "risk.account_limits.state"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    default_stop_pct:
      type: number
      minimum: 0
    min_lot:
      type: number
      minimum: 0
    max_lot:
      type: number
      minimum: 0
    lot_step:
      type: number
      minimum: 0
    specs_max_age_s:
      type: number
      minimum: 1
    commission_per_lot:
      type: number
      minimum: 0
  required:
    - default_stop_pct
    - min_lot
    - max_lot
    - lot_step
    - specs_max_age_s
  additionalProperties: false

config:
  # ٢٠٢٦-٠٩-٢٤ ٠٠:٠٣ — المالك من اللوحة: أقصى لوت 20 ⟵ 50 (حساب تجريبيّ).
  # والشروح التالية أُرجعت بعد أن مسحها حفظ اللوحة.
  # ميزانية المخاطرة ثابتة 100$ لكل صفقة؛ لا تتبع حقوق الملكية.
  default_stop_pct: 0.5
  min_lot: 0.01
  max_lot: 50
  lot_step: 0.01
  specs_max_age_s: 600.0
  # ٢٠٢٦-٠٩-١٧ — أمر المالك: «عمولة ٧ دولار على لوت ستاندرد».
  # كانت رقمًا صُلبًا 0.0 في الكود لا يُقرأ من الإعداد أصلًا، فلم تدخل
  # حساب الحجم قطّ. تدخل الآن denom فيصغر اللوت بما يغطّيها.
  commission_per_lot: 7.0
metadata:
  max_idle_s: 60
