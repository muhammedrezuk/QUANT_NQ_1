id: 517
name: "Trade Outcome"
version: "4.4.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "risk.loss_reported"
  # ٢٠٢٦-٠٩-١٨ — تنشره الذرّة فعلًا عند نقص حقيقةٍ ماليّة ولم يكن معلَنًا.
  - "financial.truth.shortage"

subscribes:
  - "market.outcome.realized"
  - "platform.account.state"
  # ٢٠٢٦-١٠-٠٢ (ختم المالك «صلح كامل nq»): عمولة صفقة الدخول — من حدث الفتح ومن صورة المركز.
  - "platform.trade_event"
  - "platform.positions.state"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    consumer_db_path:
      type: string
    cost_wait_timeout_s:
      type: number
      minimum: 0.05
      maximum: 3600
  additionalProperties: false

config:
  consumer_db_path: "var/store/risk_outcome_consumer_517.db"
  cost_wait_timeout_s: 30.0
metadata:
  max_idle_s: 3600
