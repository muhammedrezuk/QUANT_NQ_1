id: 201
name: "Swing Detection"
version: "1.6.1"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "structure.swing.state"
  # ٢٠٢٦-٠٩-٢٨ (ختم المالك «Nq»): سلّم القمم والقيعان المؤكَّدة على 15د/ساعة/4س/يوم
  # لكلّ رمز في حدثٍ واحد — منه الوقف والهدف في ٤٠٥ و٤٠٦ و٤١٠ (البتكوين والذهب).
  - "structure.levels.state"

subscribes:
  - "market_data.candle_closed"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    lookback:
      type: integer
      minimum: 1
  required:
    - lookback
  additionalProperties: false

config:
  lookback: 8
metadata:
  max_idle_s: 301
