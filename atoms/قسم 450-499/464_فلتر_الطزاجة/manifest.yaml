id: 464
name: "Freshness Filter"
version: "1.2.1"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "decision.filter.freshness.state"

subscribes:
  - "SYS_SECOND"
  - "market.tick.validated"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 2000

config_schema:
  type: object
  properties:
    stale_threshold_s:
      type: number
      minimum: 1
  required:
    - stale_threshold_s
  additionalProperties: false

config:
  stale_threshold_s: 180.0
metadata:
  max_idle_s: 151
