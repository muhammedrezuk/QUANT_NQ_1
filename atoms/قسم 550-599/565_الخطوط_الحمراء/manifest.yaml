id: 565
name: "Red Lines"
version: "1.4.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "execution.manage.intent"
  - "risk.red_line.state"

subscribes:
  - "SYS_SECOND"
  - "kernel.clock.heartbeat"
  - "platform.positions.state"
  - "market_data.calendar.state"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 5
  restart_backoff_ms: 3000

config_schema:
  type: object
  properties:
    magic:
      type: integer
      minimum: 1
    resend_after_s:
      type: number
      minimum: 5
  required:
    - magic
    - resend_after_s
  additionalProperties: false

config:
  magic: 20260801
  resend_after_s: 30.0
metadata:
  max_idle_s: 60
