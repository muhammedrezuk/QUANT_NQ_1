id: 575
name: "Management Sender"
version: "2.11.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "execution.manage.written"
  - "execution.command.failed"

subscribes:
  - "execution.manage.command"
  - "execution.gate.command"
  - "emergency.halt"
  - "risk.kill_switch.reset_requested"
  - "SYS_SECOND"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    enabled:
      type: boolean
    db_path:
      type: string
    magic:
      type: integer
      minimum: 1
  required:
    - enabled
    - db_path
    - magic
  additionalProperties: false

config:
  enabled: true
  magic: 20260801
  # ٢٠٢٦-٠٩-٢٣ — كان هنا مسارُ جهاز المالك مكتوبًا بيد
  # (`C:\Users\NQ\AppData\Roaming\…`)، أي **اسمُ صاحب الجهاز محفورٌ في عقد
  # الذرّة**: نقلُ المشروع إلى مستخدمٍ آخر يُسقطها بلا رسالة.
  #
  # والمخرجُ مرسى `NQ_BRIDGE_DB`، وصار يُضبَط في `governance/app.py` عند كلّ
  # إقلاعٍ لا على الزرّ وحده. وهو يسبق هذه القيمة دائمًا، فهذه احتياطيٌّ
  # لمن أقلع من مشغّلٍ لا يمرّ بالمشرف — و`_resolve_db` توسّعها من البيئة.
  #
  # وجسرُ ميتاتريدر يسكن `Common\Files` المشترك لا شجرةَ الرَنتايم، فلا
  # يُرسى على جذر المشروع.
  db_path: '%APPDATA%\MetaQuotes\Terminal\Common\Files\nq_brain.db'
metadata:
  max_idle_s: 60
