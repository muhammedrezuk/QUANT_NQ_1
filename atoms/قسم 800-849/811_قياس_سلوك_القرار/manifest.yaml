id: 811
name: "Decision Behaviour Meter"
version: "1.1.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "decision.behaviour.telemetry"

# ٢٠٢٦-١٠-٠٧ (ختم المالك «NQ»): خرج الاشتراك في decision.scored.state وperpetual.target.state —
# ناشراهما (٤٥٣/٥٨١) أُرشفا مع فكّ الأقسام عن القرار؛ فالمقياس ساكن بلا مدخل.
subscribes: []

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties: {}
  additionalProperties: false

config: {}

metadata:
  name_ar: "قياس سلوك القرار"
  max_idle_s: 300
