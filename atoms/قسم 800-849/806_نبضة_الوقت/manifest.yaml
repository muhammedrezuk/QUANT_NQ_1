id: 806
name: Time Tick
version: 3.0.2
core_version: '>=1.0.0,<2.0.0'
critical: true
entrypoint: atom:Atom
dependencies: []
publishes:
- SYS_SECOND
- SYS_5MIN
- SYS_15MIN
- SYS_HOUR
- SYS_DAY
- SYS_MARKET_DAY
subscribes: []
startup_mode: auto
health:
  interval_ms: 5000
  timeout_ms: 2000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 5
  restart_backoff_ms: 1000
config_schema:
  type: object
  properties:
    market_day_zone:
      type: string
    market_day_hour:
      type: integer
      minimum: 0
      maximum: 23
  additionalProperties: false
config:
  market_day_zone: Europe/Istanbul
  market_day_hour: 0
metadata:
  max_idle_s: 64
