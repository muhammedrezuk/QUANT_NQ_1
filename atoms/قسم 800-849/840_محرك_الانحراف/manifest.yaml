id: 840
name: "Drift Engine"
version: "1.0.1"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "drift.vector.state"
  - "recalibration.proposed"

subscribes:
  - "measurement.latency.state"
  - "measurement.health.state"
  - "market.regime.state"
  # ٢٠٢٦-٠٩-٠٧ — كان الاشتراك قائمًا في الكود وغائبًا هنا:
  # اشتراك صريح في الكود (atom.py:78). تغذية غير معلنة لا تظهر في أيّ خريطة، ولو حُذف
  # الحدث يومًا لما نبّه شيء.
  - "adaptation.kill_switch.state"

startup_mode: auto
health:
  interval_ms: 30000
  timeout_ms: 10000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 3000

config_schema:
  type: object
  properties:
    proposal_cooldown_windows:
      type: integer
      minimum: 0
    warmup_windows:
      type: integer
      minimum: 1
    drift_threshold:
      type: number
      minimum: 0
    proposal_cooldown_windows:
      type: integer
      minimum: 0
  additionalProperties: false

config:
  # ٢٠٢٦-٠٩-٠٧ — كان الكود يقرؤه بقيمة افتراضيّة وهو غير معلن هنا،
  # فلا يعرف المالك أنّه قابل للضبط ولا يشمله تدقيق الإقلاع.
  proposal_cooldown_windows: 100
  warmup_windows: 5
  drift_threshold: 0.5

metadata:
  max_idle_s: 300
  note: "انحراف الكمون والجاهزية مقابل خط أساس أول stable — يقترح فقط (recalibration.proposed) ولا يغيّر شيئًا أبدًا."
