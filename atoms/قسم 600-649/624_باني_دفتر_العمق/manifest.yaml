id: 624
name: "cTrader Order Book Builder"
version: "1.11.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "market.depth"
  - "market.book.state"

subscribes:
  - "feed.ctrader.raw"

startup_mode: auto

health:
  interval_ms: 10000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 5
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    state_every: {type: integer, minimum: 1}
    crossed_stale_after_s: {type: number, minimum: 0.1, maximum: 60.0}
    publish_levels: {type: integer, minimum: 0, maximum: 5000}
    max_book_levels: {type: integer, minimum: 0, maximum: 20000}
    stale_level_after_s: {type: number, minimum: 0, maximum: 600}
    min_publish_interval_s: {type: number, minimum: 0, maximum: 60}
  required: [state_every]
  additionalProperties: false

config:
  state_every: 1000
  # عمر هجر المستوى المتقاطع بالثواني — عيار المالك (٢٠٢٦-٠٩-٠٩، ختم NQ).
  # مشتقّ من قياس: دورة حذف سي‑تريدر 0.4 ثانية، ولا لقطة W في التشغيل
  # المستقرّ، فالمستوى الذي تجاوزه السعر يبقى أبدًا. ثانيتان = خمسة أضعاف
  # دورة الوسيط: لا تلمس تقاطع اللحظة، وتُقلّم المهجور قبل أن يخنق التغذية.
  # ارفعه إن رأيت تقاطعًا حيًّا يُسقَط، واخفضه إن عاد القبول ينزل.
  # ١.٠ بدل ٢.٠ (٢٠٢٦-٠٩-٠٩ ٢٢:٤٥) — تصحيحُ حكمٍ بنيتُه على لقطة.
  # قِست بعد `rescan` مباشرة فرأيت قبولًا ٩٩.٥٪ ودفترًا 14، وختمت.
  # وبعد عشرين دقيقة: قبول **٨٣.٤٪** · عمق 191 · تقليم 4,604 · يتامى
  # 10,423 · تقاطع 5,073. فالسقف كان يعالج العرَض (العدد) لا السبب
  # (المستوى المهجور)، وتقليمُه يُسقط قيودًا حيّة فتعود أوامر حذفها
  # يتيمة. وعتبةُ الهجر هي الدواء: دورة حذف الوسيط المقيسة 0.4 ثانية،
  # فواحدة = ضعفاها ونصف — أعلى من كل تقاطع لحظيّ حقيقيّ (أجزاء من
  # الثانية) وأدنى بكثير من أصغر هجر مقيس (198 ثانية).
  crossed_stale_after_s: 1.0
  # كم مستوًى يُنشر من كل طرف — ١٢ بدل ٥٠ (٢٠٢٦-٠٩-١٠).
  # المستهلك الوحيد للسلّم هو 106 وسقفه `max_levels: 10`، و623 لا
  # يمسّه (`best_bid`/`best_ask` وحدهما). فخمسون كانت هامشًا بلا آكل.
  # والقياس أوجب خفضها: عمر الرمز يتبع عدد مستوياته المنشورة —
  #   XAUUSD 88 مستوًى ⟵ 238.9ث   ·   BTCUSD 14 ⟵ 68.4ث
  #   EURUSD 12 مستوًى ⟵   0.3ث   ·   US30   10 ⟵  0.2ث
  # ولا يفسّرها الحِمل: تغذيتي ٢–٣٪ من أحداث كل رمز، وEURUSD يحمل
  # 52.3 حدثًا/ث (الأعلى) وعمره 0.3ث بينما BTCUSD يحمل 21.6 وعمره 68.
  # فالثقل في **حجم** ما يُعاد بناؤه خلفنا (`market_data.depth_updated`
  # عند 106 ينشر السلّم ثانيةً)، لا في عدد الرسائل.
  # ⚠️ ولا تأخير ولا كتم: كل نشرة تخرج فورًا وكاملة العدد، أصغر حجمًا.
  # اثنا عشر = عشرة يحتاجها 106 وهامش. ارفعه إن رفع 106 سقفه.
  publish_levels: 12
  # سقف الدفتر المحفوظ لكل طرف — أمر المالك «حط حد ينظفها».
  # ١٠٠ بدل ٣٠٠ (٢٠٢٦-٠٩-٠٩، على سؤاله «ما منحسن نوصل أسرع وجودة
  # أحسن؟»): الجودة لا تحتاج تأخيرًا، تحتاج تنظيفًا أبكر. الدفتر
  # الطبيعيّ المقيس بعد إقلاع نظيف **14–91 مستوًى**، فسقف 300 كان
  # يترك السلّم يتضخّم ثلاثة أضعاف الطبيعيّ قبل أن يُمسَك — وفي ذلك
  # الفارق يتقاطع الطرفان فيهبط قبول 112 (قِيس ٩٤.٩٪ عند deepest=600).
  # مئة = فوق أعلى طبيعيّ مقيس بهامش، ودون التضخّم بمسافة. والقصّ
  # يُسقط الأبعد عن القمّة وحده، فلا يمسّ سعرًا يُقرأ، ولا يؤخّر نشرة.
  # سقفٌ حزامَ أمان لا مقصًّا يوميًّا — بعد `stale_level_after_s` صار
  # الدفتر يُقلَّم من سببه، فلا يبلغ السقف في التشغيل السليم. يبقى
  # ليمسك أيّ انفلات (بلغ السلّم 1,724 و2,124 حين تُرك ينمو).
  max_book_levels: 300
  # عمر صمت الوسيط عن مستوًى قبل إسقاطه — **الدواء في موضع العلّة**.
  # صفر = لا إسقاط بالعمر (السلوك قبل هذا العيار).
  # مشتقّ من قياس ٢٠٢٦-٠٩-١٠ على أربع عشرة دقيقة: السلّم نما 14 ⟵ 600
  # بلا أن يستقرّ (≈42 مستوًى/دقيقة) والقبول هبط ٩٨.١٪ ⟵ ٨٦.٥٪. فلا
  # «عمق طبيعيّ» يُشتقّ منه سقف، لأنّ سي‑تريدر لا يحذف ما هجره.
  # ثلاثون ثانية = خمسة وسبعون ضعفًا لدورة حذف الوسيط المقيسة (0.4ث)،
  # وأعلى بكثير من إيقاع تحديث أيّ مستوًى حيّ (أجزاء من الثانية).
  # ارفعه إن رأيت `stale` يُسقط عمقًا تحتاجه، واخفضه إن عاد ينمو.
  stale_level_after_s: 30
  # ⛔ صفر — **حكم المالك ٢٠٢٦-٠٩-٠٩، ولا يُنقض بقياس أداء**:
  # «بتعرف بتخرّب بيتي؟ هي بالسوق الأمريكي على ناسداك إذا في خبر».
  # وهو حكمٌ صائب: عند خبر (NFP · CPI · FOMC) يقطع السعر مئات
  # النقاط في أجزاء من الثانية، فنشرُ «أحدث حالة كل ثانيتين» يعني
  # قرارًا على سعرٍ مات. والكسبُ المقيس من الدمج كان جودةً (قبول 112
  # من ٩٤.٩٪ إلى ٩٩.٥٪ ودفترًا أنظف) — **وهو لا يساوي ثانيتين على
  # خبر**. القدرة باقية في الكود لسوقٍ لا يقفز، ولا تُشغَّل هنا.
  # وأمره الأسبق يسندها: «تخرّج سيولة سريعة، ما تستنّى من حدا».
  min_publish_interval_s: 0

metadata:
  role: "book"
  upstream: "622"
  downstream: "623 · 106"
