id: 109
name: "Economic Calendar Receiver"
version: "3.12.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "market_data.calendar_event"
  - "market_data.calendar_window"
  - "market_data.calendar.state"

subscribes:
  - "market.calendar"
  - "SYS_SECOND"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 5
  restart_backoff_ms: 3000

config_schema:
  type: object
  properties:
    source_event:
      type: string
    alert_before_seconds:
      type: number
      minimum: 10
    keep_past_seconds:
      type: number
      minimum: 0
    min_impact:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    state_heartbeat_s:
      type: number
      minimum: 0
    blocking_currencies:
      type: array
      items:
        type: string
    blocking_min_impact:
      type: string
      enum: ["", LOW, MEDIUM, HIGH]
    blocking_titles:
      type: array
      items:
        type: string
    require_forward_horizon:
      type: boolean
  required:
    - source_event
    - alert_before_seconds
    - keep_past_seconds
    - min_impact
  additionalProperties: false

# ٢٠٢٦-٠٩-١٦ — `state_heartbeat_s`: نبض إعادة بثّ `market_data.calendar.state`
# بالثانية. صفر = لا نبض (السلوك قبل 3.3.0).
# كان يُنشر عند التغيّر وحده — `published=4` مقابل `duplicate=1088` في
# تشغيلة كاملة — فمن يفقد الحالة ينتظر التغيّر التالي وقد يكون بعد ساعات.
# ووقع ذلك لـ454 اليوم: حجب 1,199 قرارًا من 1,199 بـ`calendar_unknown`.
# وحدث النافذة (`calendar_window`) لا يُعاد: هو حدثُ حدوثٍ لا حالة.
config:
  source_event: "market.calendar"
  # ٢٠٢٦-٠٩-١٦ — حكم المالك: «15 دقيقة قبل خبر وبعد خبر».
  # كان الأوّل 900 (15 دقيقة) والثاني 3600 (ساعة كاملة) — فنافذة قرار
  # الفائدة الفيدراليّ الليلة كانت 20:45 ← 22:30، وصارت 20:45 ← 21:45.
  # ٢٠٢٦-١٠-١٧ (ختم المالك «NQ»، الخطوة 8): «نزّل توقيت الأخبار من ربع ساعة» ثمّ «حطّها 6 دقائق قبل وبعد» ⟸ 360 و360.
  # والخطّ الأحمر يُغلق المفتوح عند بداية النافذة (ذرّة 565) والبوّابة 555 تمنع الدخول فيها.
  # ٢٠٢٦-١٠-٢٣ (ورقة «خطوط حمراء» المختومة، القانون 25): «15 دقيقة» قبل الخبر الأحمر وبعده — أشدّ جهةٍ (10) وخمس دقائقنا ⟸ 900 و900.
  alert_before_seconds: 900.0
  keep_past_seconds: 900.0
  min_impact: "LOW"
  state_heartbeat_s: 30.0
  # ٢٠٢٦-٠٩-١٦ — حكم المالك في أمرين:
  #   «خبرٌ برازيليّ نحن ششو دخلنا — نحن نشتغل على اخبار usd.
  #    دهب وناسدك وبتكوين عملة usd»
  #   «بعدها بس اخبارة قوية الحمراء»
  #
  # فالحجب بأخبار الدولار الحمراء وحدها. والفصل مقصود:
  #   `min_impact: LOW`  ← ما **يُتتبَّع ويُعلَن** (المالك يرى العالم كلّه)
  #   العياران أدناه     ← ما **يُغلق باب الدخول** وحده
  #
  # مقيس من لقطة الذرّة قبل التغيير: 138 حدثًا متتبَّعًا، 52 منها USD
  # و86 من ستّ عشرة عملة أخرى؛ وخبرٌ برازيليّ LOW كان يمنع الذهب
  # وناسداك والبتكوين ساعةً كاملة — وكلّها مقوَّمة بالدولار.
  #
  # قائمة فارغة = كلّ العملات · أثر فارغ = كلّ الآثار (السلوك قبل 3.4.0).
  # وإضافة EUR أو GBP يومًا كلمةٌ هنا لا تعديل كود.
  # ٢٠٢٦-١٠-٢٣ (القانون 24): «خبرٌ أحمر لليورو يُغلق صفقة اليورو مقابل الدولار ويمنع دخولها. وكذلك الكنديّ والفرنك وكلّ العملات»
  # ⟸ فارغة = كلّ العملات. والحالة تعلن العملات التي نافذتها قائمة (`blocked_currencies`)، والوحدة المشتركة `shared/red_lines`
  # تحجب بها الأصول التي فيها العملة وحدها، والدولار كلّ الرموز. وحدثٌ بلا عملةٍ لا يحجب كما كان.
  blocking_currencies: []
  # ٢٠٢٦-٠٩-١٦ (ختم NQ) — الأسماء **تحلّ محلّ** التصنيف فأُفرِغ عمدًا.
  #
  # اعتراض المالك: «مبيعات تجزئة متوسّط وليس عالي تأثير» · «مخزن نفط خام
  # على النفط مو على ناسدك». وقياس على تقويم ForexFactory الرسميّ كشف
  # أنّ تصنيف مصدرنا (تقويم ميتاتريدر المدمج) يخالفه في خمسة من سبعة:
  #     مخزون النفط   عندنا HIGH   ·  ForexFactory Low
  #     بيان اللجنة   عندنا MEDIUM ·  ForexFactory High
  #     التوقّعات      عندنا MEDIUM ·  ForexFactory High
  #
  # ولو طُبّق الاثنان معًا لسقط «بيان اللجنة» و«التوقّعات» لأنّهما MEDIUM
  # عندنا — وهما من أعنف ما يحرّك الذهب وناسداك. فالأسماء بديل لا إضافة.
  #
  # مقيس على 52 حدث USD في لقطة الذرّة: كلّ نمطٍ يلتقط حدثًا واحدًا
  # بالضبط، وصفر من أحداث فيلادلفيا الستّة.
  # ٢٠٢٦-١٠-١٧ 14:55 (ختم المالك «NQ»): «تُضاف كلّ أخبار الدولار الحمراء، على كلّ فترات السوق؛ بس في خبر أحمر تُغلق
  # صفقات كلّ الأزواج» ⟸ الحاجب = تصنيف «عالٍ» (الأحمر) لا الأسماء. المصدر المفضَّل اليوم تقويم فوركس فاكتوري (616)، وتصنيفه
  # هو المرجع الذي قيس عليه اعتراض ١٦/٠٩. مقيس: آخر 30 يومًا 15 خبرًا أحمر للدولار، 13 منها 15:30 بساعة المالك.
  # (إن سقط المصدر إلى تقويم ميتاتريدر فتصنيفه أوسع — مخزون النفط «عالٍ» — فيُحجب أكثر لا أقلّ.)
  # ٢٠٢٦-١٠-١٧ (ختم المالك «NQ»، 3.11.0): الجملة السابقة نصف الحقيقة — ميتاتريدر يصنّف بيان اللجنة والمحضر «متوسّطًا» فكان
  # سيُفلتهما. قول المالك: «أخبار السنة الحمراء معروفة … الاختلاف على ميتاتريدر بس» ⟸ مرجعنا للألوان (ألوان فوركس فاكتوري،
  # وأسماء ميتاتريدر العربيّة مربوطة بها) يقرّر الأثر أيًّا كان المصدر. 22 أحمر، و157 اسمًا، وكلّ ما يصنّفه ميتاتريدر «عاليًا»
  # مربوط. واسمٌ ليس في المرجع يبقى بتصنيف مصدره ويُعدّ في سطر الصحّة («خارج المرجع»).
  blocking_min_impact: "HIGH"
  # ٢٠٢٦-٠٩-١٦ — بالعربيّة **والإنجليزيّة معًا**، لا بديلًا عن الآخر.
  #
  # 616 v1.6.0 صار يُفضّل تقويم ForexFactory (عناوينه إنجليزيّة) ويسقط
  # إلى تقويم المنصّة (عناوينه عربيّة) بعد ثمانية أيّام بلا جلب. فلو
  # كتبنا الإنجليزيّة وحدها لانكسر الحجب صامتًا يوم يسقط المصدر، ولو
  # كتبنا العربيّة وحدها لانكسر الآن.
  #
  # ومقيس على لقطة الذرّة (189 حدثًا من المصدرين): العربيّة تلتقط
  # أربعة والإنجليزيّة أربعة، وكلّها الثمانية في نافذة واحدة
  # (21:00 و21:30) — فالازدواج لا يوسّع الحجب دقيقةً واحدة.
  #
  # ولا واحد منها يلتقط `Philly Fed Manufacturing Index` ولا أخواتها
  # العربيّة الستّ.
  # ٢٠٢٦-١٠-١٧: القائمة أُفرغت (الأسماء كانت تحلّ محلّ التصنيف)، وتبقى هنا للتاريخ:
  #   «قرار سعر فائدة» · «بيان اللجنة الفيدرالية» · «التوقعات الاقتصادية للجنة» · «المؤتمر الصحفي للجنة» ·
  #   Federal Funds Rate · FOMC Statement · FOMC Economic Projections · FOMC Press Conference
  blocking_titles: []
  # ٢٠٢٦-٠٩-١٨ — «هل أعرف؟» كانت تُجاب بعدّادٍ تراكميّ.
  #
  # `known` كان `valid_received > 0`، ورقمُه يُستعاد من اللقطة (مقيس:
  # 104,921). أي أنّ الذرّة تعلن `CLEAR` و`allow_new_entries: true`
  # بثقةٍ كاملة حتى لو مات جسر الأخبار منذ أيّام.
  #
  # ومقيس اليوم من لقطة الذرّة: 422 حدثًا استُقبلت منذ آخر استعادة،
  # و**واحدٌ فقط أمامنا** (ECOFIN Meetings — 09-19 10:15، يورو منخفض
  # الأثر). فمعرفتنا تنتهي بعد ست عشرة ساعة، ولا شيء في المنصّة يقول
  # ذلك. والعلّة فوقنا: مصدر التقويم (calendar_ff) يحمل أسبوعًا جاريًا
  # فينضب مساء الجمعة — أُبلغت جلسة التغذية.
  #
  # والأفق يُنشر الآن دائمًا في `market_data.calendar.state` حقلَين:
  # `horizon_utc` و`horizon_seconds`. وهذا العيار يقرّر هل يُترجَم
  # انقضاؤه إلى `UNKNOWN` (فيوقف 454 الدخول) أم يبقى خبرًا يُقرأ.
  #
  # ٢٠٢٦-٠٩-١٩ (ختم NQ) — **شُغِّل.**
  #
  # عُرض مطفأً يوم كُتب لأنّ إيقاف التداول حكمُ مالكٍ لا اجتهاد. ثمّ
  # أثبتَه الحيُّ بعد تسع عشرة ساعة: لقطة ١٢:٥٤ت.ع `events=0` — التقويم
  # فارغٌ تمامًا، وقبل v3.9.0 كانت الذرّة ستقول `CLEAR` بثقةٍ كاملة.
  #
  # ومعناه صريحًا: **حين ينضب التقويم يُغلق باب الدخول** حتى يعود المصدر.
  # والرجعة كلمةٌ هنا (`false`) — وهي تُقرأ قرارًا صريحًا لا فراغًا،
  # فلا يدهسها افتراضيّ الكود.
  require_forward_horizon: true
metadata:
  max_idle_s: 172800
