id: 101
name: "Market Data Manager"
version: "2.2.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "market_data.state"

subscribes:
  - "market.tick.validated"
  - "market_data.price_received"
  - "market_data.candle_closed"
  - "market_data.volume_received"
  - "market_data.spread_updated"
  - "market_data.depth_updated"
  # ٢٠٢٦-١٠-٠٧ (ختم المالك «nq»): شريط الصفقات 107 أُرشف — لا شريط صفقات عند الوسيط.
  - "market_data.news_received"
  - "market_data.calendar_event"
  - "market_data.reference_index_updated"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    publish_interval_s:
      type: number
      minimum: 0
  required:
    - publish_interval_s
  additionalProperties: false

# ٢٠٢٦-٠٩-١٦ (بتفويض المالك) — إيقاع نشر الصورة الموحّدة، بالثانية ولكل
# رمز على حدة. صفر = النشر مع كل حدث (السلوك قبل 2.2.0).
# الحالة تبقى محدَّثة لحظيًّا مهما كان الإيقاع — العيار ينظّم **البثّ** لا
# الجمع، فلا تفوت الصورةَ معلومةٌ واحدة.
config:
  publish_interval_s: 1.0
metadata:
  max_idle_s: 151
