id: 123
name: "Time and Sessions Context"
version: "1.0.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes:
  - "knowledge.context.state"

subscribes:
  - "SYS_SECOND"

startup_mode: auto

health:
  interval_ms: 60000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: true
  max_restarts: 5
  restart_backoff_ms: 3000

config_schema:
  type: object
  properties:
    publish_every_s:
      type: number
      minimum: 10
  required:
    - publish_every_s
  additionalProperties: false

config:
  publish_every_s: 60.0
metadata:
  max_idle_s: 180
