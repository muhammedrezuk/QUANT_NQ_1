id: 265
name: "Depth Recorder"
version: "1.1.0"
core_version: ">=1.0.0,<2.0.0"
critical: false
entrypoint: "atom:Atom"

dependencies: []

publishes: []

subscribes:
  - "liquidity.depth.state"
  - "liquidity.microprice.state"
  - "liquidity.ofi.state"
  - "liquidity.price_impact.state"
  - "market.depth"

startup_mode: auto

health:
  interval_ms: 30000
  timeout_ms: 5000
  failure_threshold: 3
  restart_on_failure: false
  max_restarts: 3
  restart_backoff_ms: 1000

config_schema:
  type: object
  properties:
    data_dir:
      type: string
    book_levels:
      type: integer
      minimum: 1
  additionalProperties: false

config:
  data_dir: "M:\\QUANT_NQ_DATA"
  book_levels: 10
metadata:
  max_idle_s: 300
  name_ar: "مسجّل العمق"
