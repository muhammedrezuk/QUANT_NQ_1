# تشغيل الفوركس فقط — atoms/ هي نسخة QUANT_NQ الأصلية ولا تُعدّل أثناء الدمج.
log_level: INFO
log_json: true
atoms_root: atoms
snapshot_root: var/forex/snapshots

event_bus:
  payload_mode: shared_readonly
  # 0 = يُشتقّ من موارد الجهاز عند الإقلاع. ورقة المصنع §٨ تمنع رقمًا ثابتًا
  # للمعالج في الكود، و§٣٣ تمنع «تثبيت عدد العمليات على الجهاز الحالي».
  # القيمة المشتقّة بذرة مؤقّتة حتى تحسمها قياسات §٢٤.
  worker_count: 0
  partitioned_ownership: true
  mailbox_max_events: 1024
  # ⛔ المسار البارد — مشترِكون يحملون شغلًا بطيئًا يُثبَّتون على عاملٍ
  # واحد بعيدًا عن مسارات السوق. المقيس ٢٠٢٦-٠٩-١٠ على النواة الحيّة:
  #     707 حجب مساره 2,230 مرّة · أسوأ تجاوز 5.6428 ث
  #     712 نادى VACUUM داخل معالج الحدث — دورة قِيست بـ252 ثانية
  # ومسار الملكية يسلّم بالتتابع، فمن يحجب مساره يحجب كلّ ما خلفه.
  #
  # والعزل **لا يجعل المخزن أسرع** — يمنعه من تعطيل طريق السوق. وثمنه
  # معلَن: المسار البارد واحد، فالمخازن تتزاحم فيما بينها. وهذا مقصود:
  # التِكّة قبل السجلّ.
  cold_sections: [[700, 749]]
  # ── NQ ENGINE (٢٠٢٦-٠٩-١٧): القياس والمراقبة والنسخ الاحتياطيّ وبوّابة أوامر
  # المالك (800-949) باردة أيضًا — §٢١ من ورقة المحرّك: «UI · telemetry · journal ·
  # snapshots · history لا يُسمح لها بلمس الطريق الساخن». المقيس: 800/802/803/870/901
  # تحمل إدخالًا/إخراجًا في معالجاتها، و820 تشترك في كلّ تِكّة لتقيس لا لتقرّر.
  # وما تنشره (أوامر 860/901، حالات القياس) يدخل المحرّك من بابه كجذرٍ عاديّ.
  cold_sections_engine: [[700, 749], [800, 949]]
  # ⛔ §١٤ — تقسيم النطاق إلى مجموعات. المقيس ٢٠٢٦-٠٩-١٠ على نافذة خمس دقائق:
  #
  #     عامل 2 (XAUUSD)  طابور 14,565 · مُسقَط 79,796 · مشغول 132.0 ث
  #     عامل 4 (US30)    طابور      0 · مُسقَط      0 · مشغول 149.2 ث
  #
  # العامل الأكثر انشغالًا طابوره صفر، والمختنق أقلّ انشغالًا منه — فالعلّة
  # حجمُ أحداث الرمز المهيمن لا بطء المعالجات. وثمانية مشترِكين على مسار
  # XAUUSD مجموعهم ≈51 م.ث لحدثٍ واحد، بلا مهيمن (أعلاهم 13.8%).
  #
  # والآليّة في `OwnershipWorker._run`: حلقةٌ واحدة فيها `await dispatch`،
  # فمعالجٌ ينتظر يُوقف كلّ صناديق مساره. وقياس قسم 150-199 على ذرّته:
  # الحساب 3% · التجميد 6.3% · **الباقي 90.8% انتظار**.
  #
  # والعدد **مقيس لا مذوَّق**: أثقل مسارٍ هو ما يحدّ الرمز، لأنّه السلسلة
  # التي ينتظرها الحدث. بالأزمنة المقيسة حيًّا للثمانية:
  #
  #     مجموعات   مسارات   أثقل مسار (م.ث)
  #        1         1        50.95      ⟵ اليوم
  #        2         2        27.87
  #        3         2        27.37
  #        4         4        16.07      ⟵ الأدنى
  #        5         4        17.16
  #        6         4        16.83
  #
  # الأربع تعطي 16.07 م.ث — أي ثلث السلسلة الحاليّة. وما فوقها لا ينفع:
  # البصمة تكتّل، فيزيد العدد ولا يزيد الفصل.
  # والعدد هنا لا في الكود — §٤٣ تمنع تثبيته. و1 = بلا تقسيم حرفيًّا.
  scope_groups: 4
  # ⛔ **أحداث المال — تُسمّى دائمًا حين تُسقَط أو تُدمَج، بلا قصّ.**
  #
  # حكم المالك ٢٠٢٦-٠٩-١٦: «كل اللي بنيتوه بكبّه بالزبالة إذا قسم يمسّ مال
  # عنده عمًى وخلل مو معروف وين».
  #
  # والعمى كان مقيسًا: قوائم الإسقاط مقصوصة عند خمسة لكلّ عامل، فظهر
  # **266 ألف** إسقاطٍ باسمه واختفى **910,604** في ذيلٍ من **224 حدثًا**.
  # ومنها أحداثٌ على مسار المال، وبين المُسقِطين `552` مدقّق الأمر نفسه.
  #
  # فما يبدأ بهذه البادئات يُسجَّل باسمه وباسم مشترِكه في قائمةٍ **لا
  # تُقصّ**، ولو سقط مرّةً واحدة. حجمها الطبيعيّ صغير، وثمنها أرخص بكثير
  # من سؤال «أين ضاع الأمر؟» بلا جواب.
  #
  # والقائمة هنا لا في الكود (§٤٣): الناقل لا يعرف أنّ `execution.` مال —
  # يعرف أنّ الإعداد أعلن ذلك. وقائمةٌ فارغة تعني «لا تصنيف» بلا كلفة.
  critical_prefixes:
    - "execution."
    - "decision."
    - "risk."
    - "trading."
    - "platform.trade"
    - "market.outcome"
    # أُضيفت ٢٠٢٦-٠٩-١٦ بختم المالك **تشخيصًا فقط**:
    # الفقد المقيس قبلها (نافذة ٦٠٫٤ ث): `feed.mt5.tick` **464.6/ث**
    # و`feed.ctrader.raw` **45.9/ث** — مجموعُهما **510.4/ث**، وهو أكبر
    # فقدٍ في المنظومة. وبين المُسقِطين `552` و`581` و`582` و`583`:
    # ذرّاتُ مسار التنفيذ نفسها. ومع ذلك كان عدّاد «الحرج» يقول **صفرًا**،
    # لأنّ التصنيف باسم **الحدث** لا باسم المشترِك، و`feed.*` لم تكن معلَنة.
    #
    # ⛔ وهذه **لا تغيّر سياسة الإسقاط**: `_is_critical` تُنادى *بعد* قرار
    # الإخلاء/الدمج وتنفيذه (`ownership.py:688`، `:669`) — عدّادٌ لا بوّابة.
    # لا ترفع صندوقًا · لا تغيّر توجيهًا · لا تمنع إسقاطًا.
    - "feed."

journal:
  path: var/forex/journal.jsonl

snapshot:
  # اللقطة الدوريّة (خطّ الحفظ الثاني). المقيس: json.dumps لـ٧٤ م.ب كلّ دقيقة ≈ ٤٫٧٪
  # من المعالج. ثلاث دقائق: الخسارة القصوى عند سقوطٍ مفاجئ ثلاث دقائق من الحالة.
  interval_s: 180

discovery:
  # ٢٠٢٦-٠٩-١٧ (py-spy على النواة الحيّة): بصمة القرص كلّ ٥ ث كانت ≈ ٢٫٥٪ من
  # المعالج. ستّون ثانية تكفي — وPOST /api/rescan يبقى للفوريّ.
  rescan_interval_s: 60.0

api:
  enable_api: true
  host: 0.0.0.0
  port: 8010
  # External binding requires an API key from QUANT_GOV_API_KEY or
  # QUANT_CORE_API_KEY; secrets are never committed to this file.

secrets:
  enabled: true
  allow_prompt: false
  # النواة تعمل من forex_runtime/ (run_forex.py يعمل chdir)، فالخزنة على مستوى الجذر:
  vault_path: ../runtime/secrets.enc
  dpapi_blob: ../runtime/device.key

# ── مزرعة التحليل: تقاعدت ٢٠٢٦-٠٩-١٧ (NQ ENGINE §٣٨) — إعدادها ووحداتها في
#    `archive/experimental/farm/`. أيّ مفتاح `analysis_farm` هنا يُتجاهَل بتحذير.

# ── NQ ENGINE — ورقة التنفيذ النهائية (ختم المالك NQ · ٢٠٢٦-٠٩-١٧) ──────────
# محرّكٌ واحد · عمليّة واحدة · مالكٌ واحد `Account×Symbol` · رسمٌ ساخن مُصرَّف
# يُبنى من اشتراكات الذرّات عند الإقلاع ويُختم بعده · لا مزرعة ولا IPC في المسار
# الساخن · الناقل القديم يبقى للبارد (المخازن · اللوحة · القياس · المشترِكون
# العامّون). حين يكون مفعّلًا تُطفأ `analysis_farm` تلقائيًّا (§٣٨).
engine:
  enabled: true
  # مشترِكون يعملون بإيقاع «الأحدث يكفي» لكلّ `Account×Symbol` (التحليل والقرار):
  # تِكّةٌ واحدة معلّقة لكلّ نطاق، والأحدث يحلّ محلّ المعلّق ويُعدّ `coalesced`
  # لا `dropped` (§١٦). فالحمل مسقوفٌ بعدد الرموز لا بعدد التِكّات — وهذا ما
  # يجعل خبرًا قويًّا لا يُسقط شيئًا. ما دون 150 وما فوق 499 «كلّ تِكّة».
  cadence_sections: [[150, 499]]
  # أحداثٌ لا تُدمَج أبدًا ولو كان مستهلكها بإيقاع — كلّ شمعةٍ تُغلق تُحسب.
  never_coalesce_events: [market_data.candle_closed]
  # `await` يعلّق داخل سلسلة مباشرة يجمّد المحرّك كلّه: تُلغى الدورة عند المهلة
  # وتُسمّى الذرّة المعلِّقة في السجلّ و`/api/transport-stats`.
  cycle_deadline_s: 5.0
  # عمق السلسلة (تِكّة ⟶ تحقّق ⟶ تحليل ⟶ دمج ⟶ قرار ⟶ تنفيذ ≈ ١٥). وحدها
  # التغذية الراجعة (ذرّة تنشر ما تستهلكه) تتجاوزه — فتُقطع وتُعدّ وتُسمّى.
  max_depth: 64
  # ميزانيّة الدورة الواحدة بالأحداث — سياج أخير لا يُبلَغ في التشغيل السليم.
  # (المقيس: التِكّة الواحدة تولّد نحو ألف حدث بالتفرّع الطبيعيّ.)
  max_events_per_cycle: 50000
  # طابور «كلّ تِكّة» لا يُدمَج ولا يُخلى؛ بلوغه هذا العمق يُعلَن مرّةً.
  every_backlog_alarm: 2000
  # ── سقف العرض (§٢١) — اللوحة عينُ إنسان لا مسارُ تداول ──────────────────
  # المقيس ٢٠٢٦-٠٩-١٧ بـpy-spy: بثّ اللوحة **12.1٪** من معالج نواة التداول
  # (7.5٪ ترميز JSON) لعميلٍ واحد، فهبطت السعة 4,400 ⟵ 3,700 تسليمة/ث
  # وانفجر الطابور إلى 9,602 وأقدم تِكّة 130 ثانية — والطلب لم يتغيّر.
  # الحدث الذي لا يقصده إلّا مشترِكٌ عامّ يُجمَّع بالأحدث لكلّ (اسم، رمز)
  # ويُبثّ كلّ 200 م.ث: اللوحة ترى أحدثَ حالةٍ لكلّ شيء خمس مرّات في الثانية،
  # والنواة تستردّ نواتها. صفر = بلا سقف = السلوك السابق حرفًا.
  # ٢٠٢٦-٠٩-١٧ 17:05 — قِيس السقف عند 200 م.ث: وفّر **40٪** فقط، والترميز بقي
  # 9.6٪ من الحلقة لأنّ المفاتيح متنوّعة (241 اسمًا × 8 رموز). وثانيةٌ كاملة
  # كافيةٌ لعينٍ بشريّة، وأحداث الحالة تُدمج بالأحدث فلا تُفقد معلومة — تُفقد
  # **تكرارات** لا وقائع. مسار المال يمرّ فورًا لأنّ له مشترِكين محدّدين.
  cold_bus_throttle_s: 1.0
  # ── شلّال المراحل — أين تذهب الـ270 مِلّي ثانية ────────────────────────
  # المقيس ٢٠٢٦-٠٩-١٧ بعد إصلاح النبضة: الطابور صفر (أقدم عنصر 3.2 م.ث)،
  # وكلفة النداء 115.3 ⟵ 60.2 ميكروثانية، ومعالج الجذر 88 ⟵ 77٪ —
  # **والتِكّة←القرار لم تتحرّك** (0.2672 ⟵ 0.2709).
  # فالتأخير ليس ازدحامًا. وهذا يقيس عمر **كلّ حدثٍ** منذ تِكّته، فيسمّي
  # الحلقة التي تبتلع الزمن بدل تخمينها. صفر = مطفأ بلا كلفة.
  latency_stage_cap: 1024
  # ⛔ حدث التِكّة القانونيّ الذي يعرّفه §٢٩ — **اسمٌ كامل واحد لا بادئة**
  # (ختم المالك ٢٠٢٦-٠٩-١٨). البادئة `market_data.` كانت تفتح على اثني عشر
  # حدثًا، منها حالاتٌ دوريّة لا تِكّات (`quality.state` 2,878 · `feed.state`
  # 60 · `calendar.state` 57) — فكان تعريف «تِكّة ← قرار» غير مقيَّدٍ بما
  # يكفي ليكون دليلًا معماريًّا. فارغ = الافتراض في الكود.
  latency_tick_events: [market_data.price_received]

  # ── أرضيّة الإيقاع — التحليل لا يعيد الحساب مع كلّ تِكّة ──────────────
  # المقيس ٢٠٢٦-٠٩-١٧: ١٧٦ ذرّة تستيقظ لكلّ تِكّة، ونداء المعالِج الواحد
  # ١١٤٫١ ميكروثانية (67.069 ث ÷ 587,849 نداءً) ⟵ ٢٠ مِلّي ثانية من المعالج
  # لكلّ تِكّة. فعند ١٢٠ تِكّة/ث يُطلَب ٢٤٠٪ من نواة، والطابور هو التأخير.
  #
  # ولقطة الكريبتو المرجعيّة لا تختنق بـ٢٥ رمزًا على عمليّةٍ واحدة لأنّ
  # تِكّتها تقف عند طبقة البيانات (٦ مشتركين لا ٦٤) وما بعدها يقرأ حالةً
  # مُعدّة على إيقاعه. وهذه الأرضيّة تفعل ذلك **بلا لمس ذرّةٍ ولا مانيفست**:
  # حزمة الإيقاع (١٥٠–٤٩٩) لا تُشغَّل قبل مضيّ هذه المدّة على سابقتها، والدمج
  # يبقى يعمل في أثنائها فيرى التحليل **الأحدث** حين يُشغَّل.
  #
  # ⛔ ولا تمسّ مسار المال: `every` — البنية والساعة والقرار والتنفيذ —
  # بلا أرضيّة ويتقدّم الصفّ دائمًا. يثبته `tests/test_engine_cadence_floor.py`.
  #
  # صفر = السلوك السابق حرفًا.
  # ٢٠٢٦-٠٩-١٧ — القياس حكم عليها بالصفر: الأرضيّة عملت كما وُعِدت (دورات
  # الإيقاع 379,275 ⟵ 20,095، تسعة عشر ضِعفًا) لكنّ الإيقاع **٢٪ فقط** من
  # الدورات:  = 970,560 مقابل  = 20,095.
  # فالتِكّة←القرار لم تتحسّن (p50 0.2672 ⟵ 0.2811). تبقى الآليّة وحرّاسها،
  # وتُفتَح حين ينتقل الحمل إلى الإيقاع — لا قبله.
  cadence_min_interval_s: 0.0

  # ── المدخل المباشر — المجدول خارج مسار التِكّة ────────────────────────
  # المقيس ٢٠٢٦-٠٩-١٨: السلسلة داخل المحرّك تنتهي في 20–30 مِلّي ثانية،
  # وp99 تِكّة←قرار = 1.0189 ث. فالفارق ليس حسابًا ولا نقلًا ولا ازدحامًا
  # (ميل الطابور سالب والتراكم صفر) — هو **انتظار النطاق دوره في المجدول**
  # قبل أن تبدأ الدورة أصلًا، وهو تأخيرٌ لا يظهر بوصفه `backlog`.
  #
  # فالتِكّة تدخل الرسم مباشرةً حين يكون نطاقها خاليًا، ويبقى المجدول لما
  # وُجد له: الإيقاع والخلفيّة والحالة البطيئة. والحجز من المجدول نفسه
  # (`try_acquire`) فلا تجتمع دورتان على `Account×Symbol` واحد — §٣.
  #
  # false = السلوك السابق حرفًا: كلّ تِكّة عبر الطابور.
  hot_direct: true

  # ── القطع المبكّر — ما لم تتغيّر قيمته لا يوقظ أحدًا ───────────────────
  # المقيس ٢٠٢٦-٠٩-١٧: ١٠٢٬٢٠٢ تِكّة ولّدت ٢٬٧٦٨٬٧٦٤ حدثًا (٢٧٫١ لكلّ تِكّة)،
  # ومنها `decision.cycle.record` بمعدّل ١٫٠٢ لكلّ تِكّة — دورة قرارٍ كاملة عند
  # كلّ ورود سعر، تغيّر شيءٌ أم لم يتغيّر.
  #
  # وهذا ما تفعله SecDB وAthena وQuartz وBeacon، وتسمّيه Jane Street
  # `early cutoff`: تُعاد حسبة العقدة، فإن ساوى ناتجها ناتجها السابق تَوقّف
  # الانتشار. والقطع لا يقع إلّا على **قيمةٍ مشتقّة** — وحدّها مشتقٌّ من تصنيف
  # النواة المختومة نفسها (`_is_replayable`)، لا من قائمة أسماء: ما حمل علامة
  # أمرٍ (`order`/`.buy`/`.sell`/`.execute`/`.cancel`/`.submit`/`.send`/
  # `final_decision`/`command`) فعلٌ لا قيمة، ونبضات `SYS_*` غايتها الإطلاق.
  #
  #   off      : مطفأ تمامًا — بلا كلفة وبلا قياس
  #   shadow   : يحكم ويعدّ **ولا يمنع شيئًا** ⟵ يُعرَف المكسب بالرقم أوّلًا
  #   enforce  : يقطع فعلًا — لا يُفتح إلّا بختم المالك بعد قراءة `cut_ratio`
  #
  # كلفة الحكم مقيسة: ٨٫٣٢ ميكروثانية، ونقطة تعادله ١٫٦٣ مشتركًا — أي أنّه
  # يربح متى منع تسليمتين. يُقرأ من `transport_stats().engine.cutoff`.
  cutoff_mode: enforce
  cutoff_max_keys: 200000
  # ⛔ سقف الحجب — الحارس الذي يجعل `enforce` آمنًا.
  # `shared/live_analysis.py` يعلن `STATE_STALE` لكلّ نطاقٍ لم يُنشَر منذ
  # `stale_after` — وأدناها 0.5 ث بعد معامل السرعة — ومنه تصعد الحالة إلى
  # القسم ⟵ `aggregate_state=STALE` ⟵ 456 يرفض ⟵ صفر أمر. وهو العطل نفسه
  # الموثّق هناك بتاريخ ٢٠٢٦-٠٩-٠٧.
  # فالقيمة الساكنة تمرّ مرّةً كلّما تجاوز حجبُها هذا السقف. 0.25 = نصف
  # أضيق نافذةِ طزاجةٍ في النظام — هامشٌ مضاعف، لا رقمٌ مختار بالذوق.
  cutoff_max_hold_s: 0.25
  # مسابير قياسٍ بحتة — **لا تمنع شيئًا أبدًا** مهما كان الوضع أعلاه. سؤالها
  # واحد: كم يصير القطع لو أنّ فرقًا في الرقم المعنويّ العاشر لا يُعدّ تغيّرًا؟
  # المقيس ٢٠٢٦-٠٩-١٧ بالمطابقة التامّة: ١٣٫٧٢٪ فقط — لأنّ كلّ ما يُشتقّ من
  # السعر يتغيّر في كلّ تِكّة بالبناء (`analysis.*.state` صفر قطعٍ من ١٩٬٩٨٠).
  # وقد حذّرت Jane Street من هذا بالحرف: حيث تتغيّر النتيجة كلّ مرّة لا يعمل
  # القطع وتدفع صيانة الرسم فوق إعادة الحساب. فالسؤال الحقيقيّ هو التحبيب.
  # فارغة = بلا مسابير ولا كلفة.
  # ٢٠٢٦-٠٩-١٧: أُطفئت بعد أن أجابت. تشغيلها كلّف تأخّر المال p50 من
  # 0.15 ث إلى 15–23 ث — فالقياس لا يسكن نظامًا حيًّا، يزوره ويخرج.
  cutoff_probe_digits: []
  # يُحكَم على واحدٍ من كلّ N لتخفيف كلفة القياس — الإحصاء يبقى صلبًا.
  cutoff_probe_sample: 3

  # ── النواة الموزّعة — محرّكٌ لكلّ مجموعة رموز ────────────────────────────
  # المقيس ٢٠٢٦-٠٩-١٧: الجهاز 12 خيطًا ونصفه فارغ، ونواة التداول مشبعة عند
  # 104٪ من **خيطٍ واحد**. والتِكّات 120/ث بينما النظام يولّد 2,551 حدثًا/ث —
  # واحدٌ وعشرون ضِعفًا في خيطٍ واحد. فثمانية رموز تُشبعه، وعشرون (CFD +
  # شيكاغو) ضعفان ونصف فوقه ⟵ سقوط.
  #
  # الوحدة هي **الرمز**: تِكّة الذهب كلّها في عمليّة تملك الذهب وحده. ولا
  # يعبر الحدّ إلّا التِكّة داخلةً، والعمود الفقريّ (11٪ مقيسًا)، ونيّة التنفيذ
  # عائدةً. `enabled: false` يعيد محرّكًا واحدًا يحمل كلّ شيء — بلا كود.
  symbol_engines:
    # ٢٠٢٦-٠٩-١٧ 17:25 — شُغِّلت بأمر المالك المباشر («شغّل») على حساب ديمو.
    # ٢٠٢٦-٠٩-١٨ — قياسُ الجذر: تِكّة←قرار p50=0.023 وp99=0.383، والفارق
    # كلّه في الحدّ بين العمليّتين (تأخّر المال p50=0.014 · p95=0.20). والحدّ
    # وُجد هربًا من إشباع المعالج، وقد سقط مبرّره: 28٪ من الجهاز و71٪
    # احتياطيّ. فيُطفأ ويُقاس — عمليّةٌ واحدة بلا عبورٍ مرّتين (المرحلة G).
    enabled: false
    # ثلاثة: هي المُثبَتة بالإقلاع التجريبيّ (151 ذرّة لكلّ واحد، صفر فشل)،
    # وتترك للجذر والعمليّة الباردة وMT5 والنظام بقيّة الأنوية الستّ.
    groups: 3
    # ما ينتقل: مسار التِكّة كلّه — التحليل والبنية والسيولة والإحصاء
    # والاحتمالات والاستراتيجيات والقرار والمخاطر ونيّة التنفيذ.
    sections: [[100, 599]]
    # ⛔ ما لا ينتقل — بالقياس لا بالظنّ:
    #   160 الارتباط · 161 القوّة النسبيّة · 307 الارتباط الإحصائيّ: تقرأ حالة
    #       رموزٍ أخرى (مقيس سابقًا: التقسيم أعطى 20 مخرجًا خاطئًا من 60).
    #   150 · 300 · 450 مديرو الأقسام: يحملون مرساةً عابرة للرموز.
    #   601 كاتب جسر الدماغ: سلطة تنفيذٍ مركزيّة بحكم §٣.
    #   111 مزامنة الانحراف: تعتمد على الذرّة 3 (الساعة) وهي مركزيّة — والاعتماد
    #       يُفحص داخل العمليّة، فبقاؤها هناك بلا أمّها يُسقط إقلاعها (مقيس
    #       ٢٠٢٦-٠٩-١٧ في الإقلاع التجريبيّ: dependencies not running: [3]).
    exclude: [111, 150, 160, 161, 300, 307, 450, 601]
    # الأحداث بلا رمز التي تُبثّ إلى كلّ المحرّكات (العمود الفقريّ).
    # ⚠️ ٢٠٢٦-٠٩-١٧ 17:32 — الحدث الذي **يحمل رمزًا** يُوجَّه إلى مالكه قبل أن
    # يُفحص هنا، فالبادئات العريضة آمنة: لا تشمل إلّا ما لا رمز له.
    # والمقيس الذي أوجب توسيعها: 581 تحسب الحجم وتقول  —
    # لأنّ  (مواصفات الرموز من 618/622) حدثٌ بلا رمز مفرد
    # فلم يكن يصل المحرّكات. وبلا قيمة الوحدة لا يُبنى أمرٌ أبدًا.
    broadcast_prefixes: [SYS_, kernel.clock, platform., portfolio., risk.,
                         time., market., reference., adaptation., decision.settings,
                         dial., allowed.symbols, execution.gate, execution.reconcile,
                         # symbol. — ردّ سجلّ الرموز 708 (في العمليّة الباردة) على
                         # طلب 555. المقيس ٢٠٢٦-٠٩-١٧ 17:40: كلّ أمرٍ يُرفض بـ
                         # SYMBOL_RESOLUTION_TIMEOUT لأنّ الردّ لا يبلغ المحرّك.
                         emergency., symbol., storage., system., core.atom, tilt.,
                         asset., horizon., learning., ai.brain, perpetual.owner]
    # توزيعٌ معلَن للرموز على المحرّكات. فارغٌ = إسنادٌ بالورود يثبت للتشغيلة.
    symbol_groups: []
    inbox_max: 2000
    outbox_max: 20000
    boot_timeout_s: 300
    stop_timeout_s: 60
  # ── المرحلة F — العمليّة الباردة (§٢١): المخازن 700-749 والقياس والمراقبة
  # 800-949 في مفسّرٍ مستقلّ له نواةٌ لنفسه. الإيداع إليها بلا انتظار (صندوق
  # 20,000)، وما تنشره يعود جذرًا. المقيس قبلها: المسار البارد ≈ ٣٠٪ من حلقة
  # المحرّك وخيوط sqlite تحمل قفل المفسّر. `enabled: false` يعيدها إلى داخل
  # عمليّة المحرّك كما كانت — مفتاح رجوعٍ لا يحتاج كودًا.
  cold_process:
    enabled: true
    sections: [[700, 749], [800, 949]]
    # نبضة الوقت 806 تبقى في النواة — الزمن لا يُنقل عبر صندوق. والمراقب 001
    # (يرى كلّ حدث عبر `subscribe_all` ويكتب حضورًا وإنذارات سلامة) يُرحَّل:
    # مشترِكٌ عامّ على الحلقة الساخنة يكلّف تسليمةً لكلّ حدث.
    exclude: [806]
    include: [1]
    # يعدّها سجلّ البناء «مدى تنفيذ» وهي تخزينٌ وقراءةُ أوامر: تُرحَّل بإذنٍ صريح.
    # المقيس بـpy-spy: 707 وحدها ≈ ١٣٪ من معالج النواة في sqlite.
    allow_execution_scope: [703, 704, 707, 720, 901]
    lanes: 4
    # الصندوق يعدّ **دفعات** (≤200 حدث لكلّ واحدة) — 1000 دفعة ≈ 200,000 حدث.
    inbox_max: 1000
    outbox_max: 20000
    boot_timeout_s: 180
    stop_timeout_s: 45
